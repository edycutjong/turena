  <!-- ═══════════════════════════════════════════
       NODE 1 — DeepSeek R1  (purple)  y=54
       ═══════════════════════════════════════════ -->
  <g transform="translate(220,54)">
    <rect width="440" height="62" rx="12" fill="url(#df-glass)" stroke="rgba(168,85,247,0.30)" stroke-width="1"/>
    <line x1="24" y1="0.5" x2="416" y2="0.5" stroke="#A855F7" stroke-width="1.5" opacity="0.4"/>
    <!-- icon dot -->
    <circle cx="34" cy="31" r="8" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.5)" stroke-width="1"/>
    <circle cx="34" cy="31" r="3" fill="#A855F7" filter="url(#df-glow-purple)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- text -->
    <text x="54" y="24" fill="#A855F7" font-family="'Orbitron','Space Grotesk',system-ui,sans-serif"
          font-weight="700" font-size="11" letter-spacing="1.5">DEEPSEEK R1</text>
    <text x="54" y="42" fill="#64748B" font-family="'JetBrains Mono','Fira Code',monospace"
          font-size="10">deepseek-reasoner · streams reasoning_content tokens via SSE</text>
  </g>

  <!-- ═══════════════════════════════════════════
       CONNECTOR 1  (purple)  116→194
       ═══════════════════════════════════════════ -->
  <line x1="440" y1="116" x2="440" y2="194" stroke="#A855F7" stroke-width="1.5"
        stroke-dasharray="6,4" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <!-- arrowhead -->
  <polygon points="435,188 440,196 445,188" fill="#A855F7" opacity="0.6"/>
  <!-- label pill -->
  <g transform="translate(440,155)">
    <rect x="-76" y="-11" width="152" height="22" rx="11"
