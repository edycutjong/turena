  <rect width="880" height="800" fill="url(#df-mesh-purple)"/>
  <rect width="880" height="800" fill="url(#df-mesh-cyan)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="80"  x2="880" y2="80"/><line x1="0" y1="160" x2="880" y2="160"/>
    <line x1="0" y1="240" x2="880" y2="240"/><line x1="0" y1="320" x2="880" y2="320"/>
    <line x1="0" y1="400" x2="880" y2="400"/><line x1="0" y1="480" x2="880" y2="480"/>
    <line x1="0" y1="560" x2="880" y2="560"/><line x1="0" y1="640" x2="880" y2="640"/>
    <line x1="0" y1="720" x2="880" y2="720"/>
    <line x1="80"  y1="0" x2="80"  y2="800"/><line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="240" y1="0" x2="240" y2="800"/><line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/><line x1="480" y1="0" x2="480" y2="800"/>
