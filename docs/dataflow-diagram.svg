    <text x="0" y="4" text-anchor="middle" fill="#A855F7" opacity="0.8"
          font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="0.3">asyncpg INSERT</text>
  </g>
  <!-- animated dot -->
  <circle r="3.5" fill="#A855F7" filter="url(#df-glow-purple)" opacity="0">
    <animateMotion dur="1.8s" repeatCount="indefinite" begin="0s">
